name: camera-detector-test

services:
  rtsp:
    image: bluenviron/mediamtx:latest
    container_name: camera_detector_test_rtsp
    restart: unless-stopped
    ports:
      - "${TEST_RTSP_HOST_PORT:-8554}:8554"

  rtsp-publisher:
    build:
      context: .
      dockerfile: infra/Dockerfile.rtsp-publisher
    container_name: camera_detector_test_rtsp_publisher
    restart: unless-stopped
    depends_on:
      - rtsp
    environment:
      - TEST_CAMERA_COUNT=${TEST_CAMERA_COUNT:-2}
      - TEST_VIDEO_SIZE=${TEST_VIDEO_SIZE:-640x360}
      - TEST_VIDEO_FPS=${TEST_VIDEO_FPS:-10}
      - TEST_SOURCE_URLS=${TEST_SOURCE_URLS:-}
      - TEST_SOURCE_SCALE=${TEST_SOURCE_SCALE:-640:-2}
    volumes:
      - ./data-test:/app/data:ro
      - ./scripts:/app/scripts
    command: ["python", "scripts/publish_test_rtsp.py"]

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    container_name: camera_detector_test_api
    restart: unless-stopped
    ports:
      - "${TEST_API_PORT:-4100}:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite:///data/sqlite/laptop_ai_box.db
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-mzxG9QZ0N9E5_n-I54aWXZ5G8X-G9oN-w-X_gZJpL14=}
      - AUTH_ENABLED=${TEST_AUTH_ENABLED:-true}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-admin}
      - HLS_IDLE_TIMEOUT_SECONDS=${HLS_IDLE_TIMEOUT_SECONDS:-180}
    volumes:
      - ./data-test:/app/data
      - ./apps:/app/apps
      - ./libs:/app/libs
      - ./scripts:/app/scripts
    depends_on:
      - rtsp

  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.worker
    container_name: camera_detector_test_worker
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite:///data/sqlite/laptop_ai_box.db
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-mzxG9QZ0N9E5_n-I54aWXZ5G8X-G9oN-w-X_gZJpL14=}
      - RETENTION_SWEEP_INTERVAL_SECONDS=${RETENTION_SWEEP_INTERVAL_SECONDS:-3600}
    volumes:
      - ./data-test:/app/data
      - ./apps:/app/apps
      - ./libs:/app/libs
      - ./scripts:/app/scripts
    depends_on:
      - rtsp-publisher
      - api

  seed-test-cameras:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    container_name: camera_detector_test_seed
    restart: "no"
    environment:
      - DATABASE_URL=sqlite:///data/sqlite/laptop_ai_box.db
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-mzxG9QZ0N9E5_n-I54aWXZ5G8X-G9oN-w-X_gZJpL14=}
      - TEST_CAMERA_COUNT=${TEST_CAMERA_COUNT:-2}
      - TEST_RTSP_HOST=rtsp
      - TEST_RTSP_PORT=8554
      - TEST_CAMERA_FPS=${TEST_CAMERA_FPS:-2}
      - TEST_AI_ENABLED=${TEST_AI_ENABLED:-false}
    volumes:
      - ./data-test:/app/data
      - ./apps:/app/apps
      - ./libs:/app/libs
      - ./scripts:/app/scripts
    command: ["python", "scripts/seed_test_cameras.py"]
    depends_on:
      - api
      - rtsp

  tests:
    profiles:
      - test
    build:
      context: .
      dockerfile: infra/Dockerfile.test
    container_name: camera_detector_pytest
    environment:
      - DATABASE_URL=sqlite:///data-test/sqlite/pytest.db
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-mzxG9QZ0N9E5_n-I54aWXZ5G8X-G9oN-w-X_gZJpL14=}
      - AUTH_ENABLED=false
      - PYTHONPATH=/app
    volumes:
      - .:/app
    command: ["pytest", "-q"]
